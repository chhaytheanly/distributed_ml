description = "Formula 1 ML-ready data pipeline using PySpark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "sqlalchemy>=2.0.50",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "joblib>=1.4.0",
    "matplotlib>=3.11.0",
    "scikit-learn>=1.9.0",
    "torch>=2.12.1",
    "onnxruntime>=1.27.0",
    "tqdm>=4.68.3",
]
